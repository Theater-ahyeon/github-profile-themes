name: Refresh theme contribution cards
on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: theme-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch verified public PRs and rebuild all themes
        run: python scripts/build.py --refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_LOGIN: Theater-ahyeon
      - name: Publish updated data and cards
        shell: bash
        run: |
          set -euo pipefail
          git add data/github.json themes themes.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh verified upstream contribution snapshots'
          git push origin HEAD:main
